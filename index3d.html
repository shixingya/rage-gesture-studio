<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rage Studio 3D · 写实宣泄室（Beta）</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- MediaPipe Hands：手势识别（由用户手势启动摄像头，避免 Permissions Policy 拦截） -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>

  <!-- Three.js + cannon-es：通过 importmap 以 ESM 方式加载（3D 版依赖外部引擎，已获许可） -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>

  <style>
    html, body { height: 100%; margin: 0; }
    body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; background: #0b0d12; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }
    .overlay-title { text-shadow: 0 2px 8px rgba(0,0,0,.6); }
    #dropzone {
      position: absolute; right: 16px; top: 16px; width: 250px;
      background: rgba(15,18,26,.72); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 14px;
      color: #e5e7eb; box-shadow: 0 10px 30px rgba(0,0,0,.5);
    }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; background: #0b0d12; color: #cbd5e1; z-index: 50;
    }
    #camBox { position: absolute; right: 16px; bottom: 16px; width: 200px; height: 150px; border-radius: 12px; overflow: hidden; border: 2px solid rgba(255,255,255,.35); background: #000; z-index: 40; display: none; }
    #camVideo { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #gestureTag { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); background: rgba(15,18,26,.7); border: 1px solid rgba(255,255,255,.15); color: #fff; padding: 6px 16px; border-radius: 999px; font-size: 13px; display: none; z-index: 40; }
    .bar { width: 220px; height: 4px; background: rgba(255,255,255,.12); border-radius: 99px; overflow: hidden; }
    .bar > i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg,#f97316,#ef4444); animation: slide 1.1s infinite; }
    @keyframes slide { 0% { margin-left:-40% } 100% { margin-left:100% } }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="hud" class="pointer-events-none">
    <div class="absolute top-4 left-5 overlay-title">
      <h1 class="text-2xl font-black text-white/90">😤 写实宣泄室 <span class="text-sm font-normal text-white/50">3D Beta</span></h1>
      <p class="text-xs text-white/50 mt-1">Three.js 实时渲染 · PBR 材质 · 真实光照与物理 · 鼠标可旋转/拖拽砸物</p>
    </div>
    <div id="dropzone" class="pointer-events-auto">
      <h2 class="font-bold text-sm mb-2 text-white/80">控制</h2>
      <button id="smashAllBtn" class="w-full mb-2 bg-red-600 hover:bg-red-500 rounded-lg py-2 text-sm font-bold">💥 砸碎全部</button>
      <button id="resetBtn" class="w-full mb-2 bg-white/10 hover:bg-white/20 rounded-lg py-2 text-xs">🔄 重置场景</button>
      <label class="flex items-center justify-between text-xs py-1">
        <span class="text-white/60">自动旋转视角</span>
        <input id="orbitToggle" type="checkbox" class="w-4 h-4 accent-orange-500" />
      </label>
      <label class="flex items-center justify-between text-xs py-1">
        <span class="text-white/60">音效</span>
        <input id="soundToggle" type="checkbox" checked class="w-4 h-4 accent-orange-500" />
      </label>
      <p class="text-[11px] text-white/40 mt-2 leading-relaxed">鼠标：<b class="text-white/60">单击</b>选中并击飞物体，<b class="text-white/60">拖拽甩动后松手</b>抛掷，撞地高速时自动碎裂。旋转视角：左键拖空白处，滚轮缩放。</p>
      <button id="handsBtn" class="w-full mt-2 bg-orange-600 hover:bg-orange-500 rounded-lg py-2 text-sm font-bold">🙌 开启手势模式</button>
      <p id="handsTip" class="text-[11px] text-white/40 mt-1">握拳=连打 · 双手横扫=扫飞 · 捏合=抓取甩出 · 张掌下拍</p>
    </div>
  </div>

  <div id="camBox"><video id="camVideo" autoplay playsinline muted></video></div>
  <div id="gestureTag">待机</div>

  <div id="loading">
    <div class="text-lg font-bold">正在加载 3D 引擎…</div>
    <div class="bar"><i></i></div>
    <div id="loadErr" class="text-xs text-rose-400 max-w-xs text-center hidden"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import * as CANNON from 'cannon-es';

    const showErr = (msg) => { const e = document.getElementById('loadErr'); if (e) { e.textContent = msg; e.classList.remove('hidden'); } };

    // ============================================================
    // 音效：Web Audio 合成，零外部音频资源
    // ============================================================
    const Sound = (() => {
      let ctx = null, master = null, enabled = true;
      function init() {
        if (ctx) return;
        try { ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination); } catch (e) {}
      }
      function resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); }
      function noise(dur) {
        const n = ctx.sampleRate * dur, buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        const src = ctx.createBufferSource(); src.buffer = buf; return src;
      }
      function thud() {
        if (!ctx || !enabled) return;
        const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine';
        o.frequency.setValueAtTime(160, ctx.currentTime); o.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.18);
        g.gain.setValueAtTime(0.6, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
        o.connect(g); g.connect(master); o.start(); o.stop(ctx.currentTime + 0.24);
      }
      function crash(kind) {
        if (!ctx || !enabled) return;
        const src = noise(0.35), f = ctx.createBiquadFilter(), g = ctx.createGain();
        f.type = 'highpass'; f.frequency.value = kind === 'glass' ? 2500 : kind === 'metal' ? 1600 : 800;
        g.gain.setValueAtTime(0.5, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.32);
        src.connect(f); f.connect(g); g.connect(master); src.start(); src.stop(ctx.currentTime + 0.35);
      }
      function setEnabled(v) { enabled = v; }
      return { init, resume, thud, crash, setEnabled };
    })();

    // ============================================================
    // 渲染器 / 场景 / 相机 / 光照 / 环境（真实感来源）
    // ============================================================
    const app = document.getElementById('app');
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    } catch (e) { showErr('无法创建 WebGL 上下文：' + e.message); throw e; }
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    app.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0d12);
    scene.fog = new THREE.Fog(0x0b0d12, 18, 40);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(3.2, 2.2, 4.6);

    // 基于图像的照明（IBL）：RoomEnvironment 提供柔和真实的室内反射
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

    // 主光（模拟窗外阳光）+ 补光
    const sun = new THREE.DirectionalLight(0xfff2e0, 2.6);
    sun.position.set(4, 7, 3);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1; sun.shadow.camera.far = 30;
    sun.shadow.camera.left = -10; sun.shadow.camera.right = 10;
    sun.shadow.camera.top = 10; sun.shadow.camera.bottom = -10;
    sun.shadow.bias = -0.0004;
    scene.add(sun);
    const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x3a2f28, 0.55);
    scene.add(hemi);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 1.0, 0);
    controls.minDistance = 2.5; controls.maxDistance = 14;
    controls.maxPolarAngle = Math.PI * 0.495;

    // ============================================================
    // 程序化 PBR 贴图（Canvas 生成，无需外部图片）
    // ============================================================
    function makeCanvas(size, draw) {
      const c = document.createElement('canvas'); c.width = c.height = size;
      draw(c.getContext('2d'), size);
      const t = new THREE.CanvasTexture(c);
      t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
      return t;
    }
    function woodTexture() {
      return makeCanvas(512, (x, s) => {
        x.fillStyle = '#6b4a2b'; x.fillRect(0, 0, s, s);
        for (let i = 0; i < 60; i++) {
          x.strokeStyle = `rgba(${40 + Math.random() * 60 | 0},${26 + Math.random() * 30 | 0},14,${0.25 + Math.random() * 0.3})`;
          x.lineWidth = 1 + Math.random() * 3; x.beginPath();
          const y = Math.random() * s; x.moveTo(0, y);
          for (let px = 0; px <= s; px += 32) x.lineTo(px, y + Math.sin(px * 0.02 + i) * 4);
          x.stroke();
        }
      });
    }
    function wallTexture() {
      return makeCanvas(512, (x, s) => {
        x.fillStyle = '#d8d2c8'; x.fillRect(0, 0, s, s);
        for (let i = 0; i < 22000; i++) {
          x.fillStyle = `rgba(${Math.random() * 40 | 0},${Math.random() * 40 | 0},${Math.random() * 40 | 0},${Math.random() * 0.05})`;
          x.fillRect(Math.random() * s, Math.random() * s, 2, 2);
        }
      });
    }
    function tileTexture() {
      return makeCanvas(512, (x, s) => {
        x.fillStyle = '#b9bcc2'; x.fillRect(0, 0, s, s);
        const g = 128;
        for (let yy = 0; yy < s; yy += g) for (let xx = 0; xx < s; xx += g) {
          const v = 180 + (Math.random() * 30 | 0);
          x.fillStyle = `rgb(${v},${v},${v + 6})`; x.fillRect(xx + 3, yy + 3, g - 6, g - 6);
        }
        x.strokeStyle = '#8b8f96'; x.lineWidth = 4;
        for (let k = 0; k <= s; k += g) { x.beginPath(); x.moveTo(k, 0); x.lineTo(k, s); x.moveTo(0, k); x.lineTo(s, k); x.stroke(); }
      });
    }
    function roughMap(base, contrast) {
      return makeCanvas(256, (x, s) => {
        x.fillStyle = base; x.fillRect(0, 0, s, s);
        for (let i = 0; i < 8000; i++) { x.fillStyle = `rgba(255,255,255,${Math.random() * contrast})`; x.fillRect(Math.random() * s, Math.random() * s, 3, 3); }
      });
    }

    // ============================================================
    // 物理世界
    // ============================================================
    const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
    world.broadphase = new CANNON.SAPBroadphase(world);
    world.allowSleep = true;
    const matGround = new CANNON.Material('ground'), matObj = new CANNON.Material('obj');
    world.addContactMaterial(new CANNON.ContactMaterial(matGround, matObj, { friction: 0.4, restitution: 0.28 }));
    world.defaultContactMaterial.friction = 0.4;

    // 地面物理
    const groundBody = new CANNON.Body({ mass: 0, material: matGround, shape: new CANNON.Plane() });
    groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    world.addBody(groundBody);

    // ============================================================
    // 房间（写实：木/瓷砖/墙面 PBR）
    // ============================================================
    const ROOM = { w: 16, d: 16, h: 5 };
    function buildRoom() {
      const floorTex = tileTexture(); floorTex.repeat.set(8, 8);
      const floorRough = roughMap('#8a8a8a', 0.25); floorRough.repeat.set(8, 8);
      const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughnessMap: floorRough, roughness: 0.85, metalness: 0.02 });
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d), floorMat);
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

      const wallTex = wallTexture(); wallTex.repeat.set(4, 1.5);
      const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.95, metalness: 0 });
      const back = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.h), wallMat);
      back.position.set(0, ROOM.h / 2, -ROOM.d / 2); back.receiveShadow = true; scene.add(back);
      const left = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.d, ROOM.h), wallMat.clone());
      left.position.set(-ROOM.w / 2, ROOM.h / 2, 0); left.rotation.y = Math.PI / 2; left.receiveShadow = true; scene.add(left);

      // 桌面（固定的木桌，物体放上面）
      const woodTex = woodTexture(); woodTex.repeat.set(2, 1);
      const woodMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.6, metalness: 0.05 });
      const tableTop = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.12, 1.8), woodMat);
      tableTop.position.set(0, 1.0, 0); tableTop.castShadow = true; tableTop.receiveShadow = true; scene.add(tableTop);
      const tableBody = new CANNON.Body({ mass: 0, material: matObj });
      tableBody.addShape(new CANNON.Box(new CANNON.Vec3(1.6, 0.06, 0.9)));
      tableBody.position.set(0, 1.0, 0); world.addBody(tableBody);
      const legGeo = new THREE.BoxGeometry(0.12, 1.0, 0.12);
      for (const [lx, lz] of [[-1.5, -0.8], [1.5, -0.8], [-1.5, 0.8], [1.5, 0.8]]) {
        const leg = new THREE.Mesh(legGeo, woodMat); leg.position.set(lx, 0.5, lz); leg.castShadow = true; scene.add(leg);
      }
    }
    buildRoom();

    // ============================================================
    // 可砸物体：定义 + 材质 + 生成 + 碎裂
    // ============================================================
    const dynObjects = [];   // { mesh, body, kind, breakable }
    let objId = 0;

    function pbrMaterial(kind) {
      if (kind === 'glass') return new THREE.MeshPhysicalMaterial({ color: 0xbfe3ff, metalness: 0, roughness: 0.05, transmission: 0.9, thickness: 0.6, ior: 1.5, clearcoat: 1, transparent: true, opacity: 0.9 });
      if (kind === 'metal') return new THREE.MeshStandardMaterial({ color: 0xcfd4da, metalness: 1.0, roughness: 0.22, envMapIntensity: 1.2 });
      if (kind === 'ceramic') return new THREE.MeshPhysicalMaterial({ color: 0xf3ede4, metalness: 0, roughness: 0.25, clearcoat: 0.8, clearcoatRoughness: 0.2 });
      if (kind === 'wood') { const t = woodTexture(); t.repeat.set(1, 1); return new THREE.MeshStandardMaterial({ map: t, roughness: 0.7, metalness: 0.05 }); }
      return new THREE.MeshStandardMaterial({ color: 0xd9534f, roughness: 0.5, metalness: 0.1 });
    }
    function geoFor(shape) {
      if (shape === 'bottle') return new THREE.CylinderGeometry(0.09, 0.12, 0.42, 24);
      if (shape === 'mug') return new THREE.CylinderGeometry(0.11, 0.10, 0.22, 28);
      if (shape === 'can') return new THREE.CylinderGeometry(0.09, 0.09, 0.24, 28);
      if (shape === 'crate') return new THREE.BoxGeometry(0.32, 0.32, 0.32);
      if (shape === 'plate') return new THREE.CylinderGeometry(0.2, 0.2, 0.03, 32);
      if (shape === 'vase') return new THREE.CylinderGeometry(0.07, 0.13, 0.4, 28);
      return new THREE.BoxGeometry(0.25, 0.25, 0.25);
    }
    function shapeToCannon(shape, geo) {
      geo.computeBoundingBox(); const s = new THREE.Vector3(); geo.boundingBox.getSize(s);
      if (shape === 'crate' || shape === 'box') return new CANNON.Box(new CANNON.Vec3(s.x / 2, s.y / 2, s.z / 2));
      const r = Math.max(s.x, s.z) / 2, h = s.y / 2;
      return new CANNON.Cylinder(r, r, h * 2, 16);
    }
    function spawnObject(def) {
      const geo = geoFor(def.shape);
      const mesh = new THREE.Mesh(geo, pbrMaterial(def.kind));
      mesh.castShadow = true; mesh.receiveShadow = true;
      const px = def.x, py = def.y, pz = def.z;
      mesh.position.set(px, py, pz); scene.add(mesh);
      const body = new CANNON.Body({ mass: def.mass || 0.6, material: matObj, position: new CANNON.Vec3(px, py, pz) });
      body.addShape(shapeToCannon(def.shape, geo));
      body.allowSleep = true; body.sleepSpeedLimit = 0.2;
      world.addBody(body);
      const rec = { id: objId++, mesh, body, kind: def.kind, shape: def.shape, breakable: true, home: new THREE.Vector3(px, py, pz) };
      mesh.userData.rec = rec; dynObjects.push(rec); return rec;
    }

    const OBJECT_DEFS = [
      { shape: 'bottle', kind: 'glass', x: -0.9, y: 1.27, z: 0.2, mass: 0.5 },
      { shape: 'mug', kind: 'ceramic', x: -0.3, y: 1.17, z: -0.3, mass: 0.5 },
      { shape: 'can', kind: 'metal', x: 0.3, y: 1.18, z: 0.3, mass: 0.4 },
      { shape: 'crate', kind: 'wood', x: 0.9, y: 1.22, z: -0.2, mass: 0.9 },
      { shape: 'plate', kind: 'ceramic', x: 0.0, y: 1.12, z: 0.6, mass: 0.4 },
      { shape: 'bottle', kind: 'glass', x: -0.6, y: 1.27, z: -0.5, mass: 0.5 },
      { shape: 'can', kind: 'metal', x: 0.6, y: 1.18, z: 0.55, mass: 0.4 },
      { shape: 'vase', kind: 'ceramic', x: -1.25, y: 1.32, z: -0.55, mass: 0.7 },
      { shape: 'box', kind: 'wood', x: 1.25, y: 1.22, z: 0.45, mass: 0.8 },
    ];
    function populate() { OBJECT_DEFS.forEach(spawnObject); }
    populate();

    // 碎块（真实碎裂：把物体拆成多个小碎块并各自受物理驱动）
    const chunks = [];   // { mesh, body, born }
    function makeChunkMat(rec) { return rec.mesh.material.clone(); }
    function shatter(rec, impactV) {
      if (!rec.breakable) return;
      const idx = dynObjects.indexOf(rec); if (idx >= 0) dynObjects.splice(idx, 1);
      scene.remove(rec.mesh); world.removeBody(rec.body);
      const center = rec.mesh.position.clone();
      const mat = makeChunkMat(rec);
      const n = rec.shape === 'crate' ? 8 : 6;
      for (let i = 0; i < n; i++) {
        const sz = 0.06 + Math.random() * 0.08;
        const g = new THREE.TetrahedronGeometry(sz);
        const m = new THREE.Mesh(g, mat); m.castShadow = true;
        m.position.copy(center).add(new THREE.Vector3((Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.2));
        scene.add(m);
        const b = new CANNON.Body({ mass: 0.12, material: matObj, position: new CANNON.Vec3(m.position.x, m.position.y, m.position.z) });
        b.addShape(new CANNON.Sphere(sz * 0.8));
        const kick = 1.4 + (impactV || 0) * 0.4;
        b.velocity.set((Math.random() - 0.5) * kick, Math.random() * kick, (Math.random() - 0.5) * kick);
        b.angularVelocity.set(rand(-8, 8), rand(-8, 8), rand(-8, 8));
        world.addBody(b);
        chunks.push({ mesh: m, body: b, born: performance.now() });
      }
      Sound.crash(rec.kind);
      spawnDust(center, 14);
      rec.mesh.geometry.dispose();
    }

    // 简单尘埃粒子
    const dust = [];
    const dustGeo = new THREE.BufferGeometry();
    function spawnDust(pos, n) {
      for (let i = 0; i < n; i++) {
        const m = new THREE.Mesh(new THREE.SphereGeometry(0.02, 6, 6), new THREE.MeshBasicMaterial({ color: 0xdddddd, transparent: true, opacity: 0.6 }));
        m.position.copy(pos); scene.add(m);
        const v = new THREE.Vector3((Math.random() - 0.5) * 2, Math.random() * 2, (Math.random() - 0.5) * 2);
        dust.push({ mesh: m, v, born: performance.now() });
      }
    }
    function rand(a, b) { return a + Math.random() * (b - a); }

    // ============================================================
    // 交互：射线拾取 + 单击击飞 + 拖拽抛掷
    // ============================================================
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let dragRec = null, dragPrev = null, dragTime = 0, moved = false;
    const meshList = () => dynObjects.map(o => o.mesh);

    function pick(ev) {
      const r = renderer.domElement.getBoundingClientRect();
      pointer.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
      pointer.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObjects(meshList(), false);
      return hit.length ? hit[0].object.userData.rec : null;
    }
    renderer.domElement.addEventListener('pointerdown', (ev) => {
      Sound.init(); Sound.resume();
      const rec = pick(ev);
      if (rec) {
        dragRec = rec; dragPrev = { x: ev.clientX, y: ev.clientY, t: performance.now() }; moved = false;
        controls.enabled = false;
      }
    });
    window.addEventListener('pointermove', (ev) => {
      if (!dragRec) return;
      moved = true;
      const now = performance.now();
      dragPrev = { x: ev.clientX, y: ev.clientY, t: now };
    });
    window.addEventListener('pointerup', (ev) => {
      if (!dragRec) return;
      const rec = dragRec; dragRec = null; controls.enabled = true;
      const dt = Math.max(0.016, (performance.now() - (dragPrev ? dragPrev.t : performance.now())) / 1000);
      if (!moved) {
        // 单击：朝远离相机方向击飞
        const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
        rec.body.wakeUp(); rec.body.applyImpulse(new CANNON.Vec3(dir.x * 2.2, dir.y * 2.2 + 1.2, dir.z * 2.2));
        Sound.thud();
      } else {
        const dx = (ev.clientX - dragPrev.x), dy = (ev.clientY - dragPrev.y);
        rec.body.wakeUp(); rec.body.applyImpulse(new CANNON.Vec3(dx * 0.06, -dy * 0.06 + 1.0, 0));
        Sound.thud();
      }
    });

    document.getElementById('smashAllBtn').addEventListener('click', () => {
      Sound.init(); Sound.resume();
      dynObjects.slice().forEach(rec => shatter(rec, 3));
    });
    document.getElementById('resetBtn').addEventListener('click', () => reset());
    document.getElementById('soundToggle').addEventListener('change', (e) => Sound.setEnabled(e.target.checked));
    document.getElementById('orbitToggle').addEventListener('change', (e) => { controls.autoRotate = e.target.checked; controls.autoRotateSpeed = 1.0; });

    function reset() {
      dynObjects.slice().forEach(rec => { scene.remove(rec.mesh); world.removeBody(rec.body); });
      dynObjects.length = 0;
      chunks.slice().forEach(c => { scene.remove(c.mesh); world.removeBody(c.body); });
      chunks.length = 0;
      dust.slice().forEach(d => { scene.remove(d.mesh); d.mesh.geometry.dispose(); d.mesh.material.dispose(); });
      dust.length = 0;
      populate();
    }

    // ============================================================
    // 主循环：物理步进 + 同步 + 高速碰撞碎裂检测
    // ============================================================
    const clock = new THREE.Clock();
    let acc = 0;
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(0.033, clock.getDelta());
      acc += dt;
      const step = 1 / 120; let n = 0;
      while (acc >= step && n < 6) {
        world.step(step);
        acc -= step; n++;
        // 检测高速撞击地面 → 碎裂
        for (const rec of dynObjects.slice()) {
          const v = rec.body.velocity; const speed = Math.hypot(v.x, v.y, v.z);
          if (speed > 3.2 && rec.body.position.y < 0.35) { shatter(rec, speed); }
        }
      }
      for (const rec of dynObjects) {
        rec.mesh.position.copy(rec.body.position);
        rec.mesh.quaternion.copy(rec.body.quaternion);
      }
      const now = performance.now();
      for (let i = chunks.length - 1; i >= 0; i--) {
        const c = chunks[i];
        c.mesh.position.copy(c.body.position); c.mesh.quaternion.copy(c.body.quaternion);
        if (now - c.born > 6000) { scene.remove(c.mesh); world.removeBody(c.body); chunks.splice(i, 1); }
      }
      for (let i = dust.length - 1; i >= 0; i--) {
        const d = dust[i]; const age = (now - d.born) / 1000;
        d.mesh.position.addScaledVector(d.v, dt); d.v.y -= dt * 2;
        d.mesh.material.opacity = Math.max(0, 0.6 * (1 - age / 1.2));
        if (age > 1.2) { scene.remove(d.mesh); d.mesh.geometry.dispose(); d.mesh.material.dispose(); dust.splice(i, 1); }
      }
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============================================================
    // 手势识别（阶段二）：MediaPipe Hands + 姿态保持式触发，与鼠标共用同一套动作
    // ============================================================
    const gestureTagEl = document.getElementById('gestureTag');
    let curGesture = '待机';
    function setGesture(g) { curGesture = g; if (gestureTagEl) gestureTagEl.textContent = g; }
    const dist3 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
    function isExtG(lm, tip, pip) { const w = lm[0]; return dist3(lm[tip], w) > dist3(lm[pip], w) * 1.12; }
    function isFistG(lm) { return [isExtG(lm, 8, 6), isExtG(lm, 12, 10), isExtG(lm, 16, 14), isExtG(lm, 20, 18)].filter(Boolean).length <= 1; }
    function isOpenPalmG(lm) { return [isExtG(lm, 8, 6), isExtG(lm, 12, 10), isExtG(lm, 16, 14), isExtG(lm, 20, 18)].filter(Boolean).length >= 4; }
    function isPinchG(lm) { const size = dist3(lm[0], lm[9]) || 1; return dist3(lm[4], lm[8]) < size * 0.45; }
    const cdG = {}; function canFireG(name, ms) { const t = performance.now(); if (cdG[name] && t - cdG[name] < ms) return false; cdG[name] = t; return true; }

    // 掌心归一化坐标 → 世界空间取点（沿相机方向推入场景深度 T）
    const _v = new THREE.Vector3(), _v2 = new THREE.Vector3(), _dir = new THREE.Vector3();
    const DEPTH_T = 7.5;
    function palmWorld(lm) {
      const mx = (lm[0].x + lm[9].x) / 2, my = (lm[0].y + lm[9].y) / 2;
      _v.set(1 - mx, my, 0.5).unproject(camera);
      _dir.copy(camera.position).sub(_v).normalize();
      const p = _v2.copy(camera.position).addScaledVector(_dir, DEPTH_T);
      return { x: p.x, y: p.y, z: p.z, nx: 1 - mx, ny: my };
    }
    function nearestRec(p, maxR) {
      let best = null, bd = maxR;
      for (const rec of dynObjects) {
        const d = Math.hypot(rec.mesh.position.x - p.x, rec.mesh.position.y - p.y, rec.mesh.position.z - p.z);
        if (d < bd) { bd = d; best = rec; }
      }
      return best;
    }
    function hitRec(rec, power) {
      if (!rec) return;
      const v = rec.body.velocity;
      rec.body.wakeUp();
      rec.body.velocity.set(v.x + rand(-1, 1) * power, v.y + power * 0.8, v.z + rand(-1, 1) * power);
      rec.body.angularVelocity.set(rand(-6, 6), rand(-6, 6), rand(-6, 6));
      Sound.thud();
      if (Math.hypot(rec.body.velocity.x, rec.body.velocity.y, rec.body.velocity.z) > 4.6) shatter(rec, 4);
    }
    function sweepAll() {
      const list = dynObjects.slice();
      if (!list.length) return;
      Sound.thud();
      list.forEach(rec => {
        rec.body.wakeUp();
        rec.body.applyImpulse(new CANNON.Vec3(rand(-4, 4), rand(2.5, 5), rand(-4, 4)));
        rec.body.angularVelocity.set(rand(-8, 8), rand(-8, 8), rand(-8, 8));
        if (Math.hypot(rec.body.velocity.x, rec.body.velocity.y, rec.body.velocity.z) > 3.2) shatter(rec, 4);
      });
    }

    let prevPalm = null, pinchHeld = false, grabRec = null, grabPrev = null;
    function analyzeHandsG(res) {
      const all = res.multiHandLandmarks || [];
      if (!all.length) {
        if (pinchHeld && grabRec && grabPrev) { const v = grabPrev; grabRec.body.wakeUp(); grabRec.body.velocity.set(v.x * 9, v.y * 9 + 1.5, v.z * 9); Sound.thud(); }
        pinchHeld = false; grabRec = null; setGesture('检测中…无手'); return;
      }
      const now = performance.now(), lm = all[0], pc = palmWorld(lm);
      let vx = 0, vy = 0, dt = 0.016;
      if (prevPalm) { dt = Math.max(0.001, (now - prevPalm.t) / 1000); vx = (pc.nx - prevPalm.nx) / dt; vy = (pc.ny - prevPalm.ny) / dt; }
      prevPalm = { x: pc.x, y: pc.y, z: pc.z, nx: pc.nx, ny: pc.ny, t: now };

      if (all.length >= 2 && Math.abs(vx) > 1.4 && canFireG('sweep', 600)) { sweepAll(); setGesture('双手横扫'); return; }
      if (isFistG(lm)) {
        setGesture('握拳');
        if (canFireG('hit', 340)) hitRec(nearestRec(pc, 999) || dynObjects[0] || null, 1.2);
        return;
      }
      if (isPinchG(lm)) {
        if (!pinchHeld) { grabRec = nearestRec(pc, 1.5); pinchHeld = true; }
        else if (grabRec) {
          grabRec.body.wakeUp();
          grabRec.body.velocity.set((pc.x - grabRec.mesh.position.x) * 6, (pc.y - grabRec.mesh.position.y) * 6, (pc.z - grabRec.mesh.position.z) * 6);
          grabRec.body.position.set(pc.x, pc.y, pc.z); grabRec.mesh.position.copy(pc);
          grabPrev = { x: (pc.x - (prevPalm ? prevPalm.x : pc.x)) / dt, y: (pc.y - (prevPalm ? prevPalm.y : pc.y)) / dt, z: (pc.z - (prevPalm ? prevPalm.z : pc.z)) / dt };
        }
        setGesture('捏合抓取'); return;
      }
      if (pinchHeld) {
        pinchHeld = false;
        if (grabRec && grabPrev) { grabRec.body.wakeUp(); grabRec.body.velocity.set(grabPrev.x * 9, grabPrev.y * 9 + 1.5, grabPrev.z * 9); Sound.thud(); }
        grabRec = null;
      }
      if (isOpenPalmG(lm) && vy > 1.8 && canFireG('slap', 500)) { hitRec(nearestRec(pc, 1.2), 1.6); setGesture('下拍'); return; }
      if (isOpenPalmG(lm) && canFireG('push', 700)) { const r = nearestRec(pc, 1.2); if (r) { r.body.wakeUp(); r.body.applyImpulse(new CANNON.Vec3(0, 0.5, -1.4)); setGesture('前推'); return; } }
      if (isOpenPalmG(lm)) { setGesture('张掌'); return; }
      setGesture('手中');
    }

    let handsGen = null, handsRunning = false, mpCam = null;
    async function startHands() {
      Sound.init(); Sound.resume();
      if (typeof Hands === 'undefined') { showErr('手势引擎未能加载，请检查网络后刷新（鼠标玩法仍可用）'); return; }
      if (handsRunning) { stopHands(); return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
        const video = document.getElementById('camVideo');
        video.srcObject = stream;
        await video.play().catch(() => {});
        document.getElementById('camBox').style.display = 'block';
        gestureTagEl.style.display = 'block';
        if (!handsGen) {
          handsGen = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}` });
          handsGen.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
          handsGen.onResults(analyzeHandsG);
        }
        let lastSend = 0;
        const loop = () => {
          if (!handsRunning) return;
          if (video.readyState >= 2 && performance.now() - lastSend > 90) { lastSend = performance.now(); handsGen.send({ image: video }); }
          requestAnimationFrame(loop);
        };
        handsRunning = true;
        const btn = document.getElementById('handsBtn');
        btn.textContent = '🙌 关闭手势模式'; btn.classList.replace('bg-orange-600', 'bg-white/10'); btn.classList.replace('hover:bg-orange-500', 'hover:bg-white/20');
        requestAnimationFrame(loop);
        setGesture('手势已开启');
      } catch (e) {
        showErr('摄像头不可用：' + e.message + '（鼠标玩法仍可用）');
      }
    }
    function stopHands() {
      handsRunning = false;
      const v = document.getElementById('camVideo');
      if (v && v.srcObject) { v.srcObject.getTracks().forEach(t => t.stop()); v.srcObject = null; }
      document.getElementById('camBox').style.display = 'none';
      gestureTagEl.style.display = 'none';
      const btn = document.getElementById('handsBtn');
      btn.textContent = '🙌 开启手势模式'; btn.classList.replace('bg-white/10', 'bg-orange-600'); btn.classList.replace('hover:bg-white/20', 'hover:bg-orange-500');
      setGesture('待机');
    }
    document.getElementById('handsBtn').addEventListener('click', startHands);

    // 首帧成功后隐藏 loading
    window.__rage3d = { THREE, renderer, scene, camera, controls, world, dynObjects, chunks, shatter, reset, setGesture, analyzeHandsG, startHands, stopHands, isHandsOn: () => handsRunning };
    try {
      renderer.render(scene, camera);
      document.getElementById('loading').style.display = 'none';
      animate();
    } catch (e) { showErr('初始化渲染失败：' + e.message); }
  </script>
</body>
</html>
