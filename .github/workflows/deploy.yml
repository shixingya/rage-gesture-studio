name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable GitHub Pages (idempotent)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let enabled = false;
            try {
              const res = await github.rest.pages.get({ owner, repo });
              enabled = res.status === 200;
            } catch (e) { enabled = false; }
            if (!enabled) {
              core.info('Pages not enabled yet -> enabling with workflow build type');
              await github.rest.pages.createOrUpdateSite({ owner, repo, build_type: 'workflow' });
            } else {
              core.info('Pages already enabled');
            }
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
