<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rage Gesture Studio · 手势宣泄室</title>

  <!-- Tailwind CSS：全部依赖通过 CDN 引入，无需构建、无需后端 -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- MediaPipe Hands + Camera Utils：手势识别核心，通过 CDN 加载 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>

  <style>
    /* ===== 全局卡通风格基调 ===== */
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Comic Sans MS", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: #1f2430;
      overflow: hidden;
      -webkit-user-select: none; user-select: none;
    }
    /* 主舞台画布：按比例自适应铺满可用区域 */
    #stage { display: block; width: 100%; height: 100%; }
    .stage-wrap { position: relative; }

    /* 右下角摄像头预览窗口（半透明） */
    #camBox {
      position: absolute; right: 16px; bottom: 16px;
      width: 220px; height: 165px; border-radius: 14px; overflow: hidden;
      border: 3px solid rgba(255,255,255,.55); box-shadow: 0 6px 20px rgba(0,0,0,.4);
      background: #000; transition: opacity .3s, transform .3s; z-index: 30;
    }
    #camBox.hidden-preview { opacity: 0; transform: translateY(120%) scale(.6); pointer-events: none; }
    #camCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #camVideo { display: none; }

    /* 侧边控制面板滚动条美化 */
    .panel::-webkit-scrollbar { width: 8px; }
    .panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,.25); border-radius: 8px; }

    /* 滑块样式 */
    input[type=range] { accent-color: #f97316; }

    /* 状态栏浮层文字描边，保证任何背景都可读 */
    .outline-text { text-shadow: 0 1px 3px rgba(0,0,0,.6); }

    /* 手势提示徽标 */
    .badge { transition: all .2s; }
    .badge.active { background: #f97316 !important; color: #fff !important; transform: scale(1.08); box-shadow: 0 0 12px #f97316aa; }

    /* 免责声明底部条 */
    #disclaimer {
      position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
      z-index: 25; pointer-events: none; white-space: nowrap;
    }
  </style>
</head>

<body class="text-white">
  <div class="flex h-screen w-screen">

    <!-- ================= 主舞台区域 ================= -->
    <div class="stage-wrap flex-1 relative bg-[#2b3242]">
      <canvas id="stage"></canvas>

      <!-- 顶部状态栏：当前选中对象 + 破坏计数 + 当前手势 -->
      <div class="absolute top-0 left-0 right-0 flex items-center justify-between px-4 py-2
                  bg-gradient-to-b from-black/50 to-transparent outline-text pointer-events-none z-20">
        <div class="flex items-center gap-3 pointer-events-auto">
          <div class="bg-white/15 backdrop-blur rounded-full px-4 py-1.5 text-sm flex items-center gap-2">
            <span class="opacity-70">当前目标：</span>
            <span id="uiTarget" class="font-bold text-amber-300">未选择</span>
          </div>
          <div class="bg-white/15 backdrop-blur rounded-full px-4 py-1.5 text-sm flex items-center gap-2">
            <span class="opacity-70">破坏计数：</span>
            <span id="uiBreak" class="font-bold text-rose-400">0</span>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span class="bg-black/40 rounded-full px-3 py-1 text-xs" id="uiGesture">手势：待机</span>
        </div>
      </div>

      <!-- 左上角场景切换快速按钮 -->
      <div class="absolute top-16 left-4 flex flex-col gap-2 z-20">
        <button data-scene="office" class="scene-btn badge bg-white/15 hover:bg-white/25 rounded-lg px-3 py-2 text-sm text-left">🏢 办公室</button>
        <button data-scene="room" class="scene-btn badge bg-white/15 hover:bg-white/25 rounded-lg px-3 py-2 text-left text-sm">🧱 空发泄房</button>
      </div>

      <!-- 免责声明 -->
      <div id="disclaimer" class="text-center text-xs text-white/70">
        ⚠️ 本程序仅为虚拟趣味情绪释放工具，请勿模仿现实破坏与暴力行为。
      </div>

      <!-- 摄像头预览窗口 -->
      <div id="camBox">
        <video id="camVideo" playsinline></video>
        <canvas id="camCanvas"></canvas>
        <!-- 手势 HUD：引擎状态 / 检测手数 / 当前姿势 -->
        <div id="camHud" class="absolute left-0 right-0 bottom-0 px-2 py-1 bg-black/70 text-[11px] leading-tight">
          <div class="flex justify-between">
            <span>引擎：<b id="hudEngine" class="text-white/60">未启动</b></span>
            <span>手：<b id="hudHands" class="text-white/60">0</b></span>
          </div>
          <div>姿势：<span id="hudPose" class="text-amber-300 font-bold">待机</span></div>
        </div>
        <div id="camTip" class="absolute inset-0 flex items-center justify-center text-xs text-center px-2 bg-black/60" style="white-space:pre-line">
          摄像头已关闭
        </div>
      </div>
    </div>

    <!-- ================= 侧边控制面板 ================= -->
    <aside class="panel w-72 shrink-0 bg-[#171b24] border-l border-white/10 overflow-y-auto p-4 flex flex-col gap-5 text-sm">
      <div>
        <h1 class="text-lg font-black text-amber-400">😤 手势宣泄室</h1>
        <p class="text-xs text-white/50 mt-1">挥拳 · 甩物 · 拍打 · 横扫，安全发泄</p>
      </div>

      <!-- 对象选择 -->
      <section class="flex flex-col gap-2">
        <h2 class="font-bold text-white/80">🎯 对象选择</h2>
        <select id="objSelect" class="bg-[#242b38] rounded-lg px-3 py-2 border border-white/10 w-full"></select>
        <p class="text-[11px] text-white/40">提示：也可直接点击画面里的物体选中它。</p>
      </section>

      <!-- 灯光设置 -->
      <section class="flex flex-col gap-3">
        <h2 class="font-bold text-white/80">💡 灯光设置</h2>
        <label class="flex flex-col gap-1">
          <span class="text-xs text-white/60">灯光强度：<span id="lightVal">70</span></span>
          <input id="lightSlider" type="range" min="0" max="100" value="70" />
        </label>
        <div class="flex gap-2">
          <button id="warmBtn" class="flex-1 badge bg-orange-500/30 border border-orange-400/40 rounded-lg py-1.5">暖光</button>
          <button id="coolBtn" class="flex-1 badge bg-sky-500/20 border border-sky-400/30 rounded-lg py-1.5">冷光</button>
        </div>
        <label class="flex items-center justify-between">
          <span class="text-xs text-white/60">环境氛围光</span>
          <input id="ambientToggle" type="checkbox" checked class="w-5 h-5 accent-orange-500" />
        </label>
      </section>

      <!-- 材质设置 -->
      <section class="flex flex-col gap-2">
        <h2 class="font-bold text-white/80">🧪 材质设置 <span class="text-[11px] text-white/40 font-normal">(作用于选中对象)</span></h2>
        <div id="matGrid" class="grid grid-cols-3 gap-2">
          <button data-mat="plastic" class="mat-btn badge bg-white/10 rounded-lg py-2 text-xs">塑料</button>
          <button data-mat="glass" class="mat-btn badge bg-white/10 rounded-lg py-2 text-xs">玻璃</button>
          <button data-mat="wood" class="mat-btn badge bg-white/10 rounded-lg py-2 text-xs">木头</button>
          <button data-mat="metal" class="mat-btn badge bg-white/10 rounded-lg py-2 text-xs">金属</button>
          <button data-mat="skin" class="mat-btn badge bg-white/10 rounded-lg py-2 text-xs">卡通皮肤</button>
        </div>
      </section>

      <!-- 音效 -->
      <section class="flex items-center justify-between">
        <h2 class="font-bold text-white/80">🔊 音效</h2>
        <button id="muteBtn" class="badge bg-white/10 rounded-lg px-4 py-1.5">已开启</button>
      </section>

      <!-- 摄像头开关 -->
      <section class="flex items-center justify-between">
        <h2 class="font-bold text-white/80">📷 摄像头</h2>
        <button id="camBtn" class="badge bg-white/10 rounded-lg px-4 py-1.5">开启</button>
      </section>

      <div class="mt-auto flex flex-col gap-2 pt-3">
        <button id="resetBtn" class="bg-rose-600 hover:bg-rose-500 rounded-lg py-2.5 font-bold">🔄 重置场景</button>
        <details class="text-xs text-white/50">
          <summary class="cursor-pointer">手势说明</summary>
          <ul class="mt-2 space-y-1 list-disc pl-4">
            <li>握拳挥拳：击打目标</li>
            <li>拇指食指捏合：抓起并甩出</li>
            <li>手掌向下猛拍：砸向目标</li>
            <li>手掌向前推：推飞目标</li>
            <li>双手横扫：扫落周边物品</li>
            <li>张开手掌靠近：吓唬目标</li>
          </ul>
        </details>
      </div>
    </aside>
  </div>

  <!-- ================= 应用逻辑（模块化） ================= -->
  <script>
    "use strict";

    // ============================================================
    // 【全局配置与状态】集中管理，供各模块共享
    // ============================================================
    const CANVAS_W = 1280;
    const CANVAS_H = 720;

    const stage = document.getElementById('stage');
    const sctx = stage.getContext('2d');
    stage.width = CANVAS_W;
    stage.height = CANVAS_H;

    const camBox = document.getElementById('camBox');
    const camVideo = document.getElementById('camVideo');
    const camCanvas = document.getElementById('camCanvas');
    const cctx = camCanvas.getContext('2d');

    // 材质属性表：不同材质的碎片颜色、数量倍率、声音特征、是否会碎
    const MATERIALS = {
      plastic: { label: '塑料', color: '#8ecae6', shards: 14, sound: 'plastic', breakable: true },
      glass:   { label: '玻璃', color: '#a5f3fc', shards: 30, sound: 'glass',  breakable: true },
      wood:    { label: '木头', color: '#b5651d', shards: 12, sound: 'wood',   breakable: true },
      metal:   { label: '金属', color: '#cbd5e1', shards: 10, sound: 'metal',  breakable: true },
      skin:    { label: '卡通皮肤', color: '#fca5a5', shards: 0, sound: 'cry', breakable: false },
    };

    // 全局运行状态
    const state = {
      scene: 'office',        // office | room
      objects: [],            // 场景对象列表
      selectedId: null,       // 当前选中的对象 id
      particles: [],          // 粒子/碎片
      floaters: [],           // 伤害数字/表情气泡
      shake: 0,               // 屏幕震动强度（每帧衰减）
      light: { intensity: 70, warm: true, ambient: true },
      muted: false,
      camOn: false,
      breakCount: 0,
      lastAction: 0,          // 防抖：上次触发动作的时间戳
    };

    // 交互用：当前被"抓住"拖动的对象（鼠标或手势共用）
    let grabbed = null;       // { obj, offX, offY, lastX, lastY, vx, vy }

    // 工具函数：限定数值范围
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    // 工具函数：两点距离
    function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
    // 工具函数：生成随机数（区间）
    function rand(a, b) { return a + Math.random() * (b - a); }

    // ============================================================
    // 【音效模块】优先使用 Web Audio 合成音，零外部依赖，
    //   保证无网络/无音频资源时程序依然正常运行；
    //   遵循浏览器策略：首次用户交互后才创建/恢复 AudioContext。
    // ============================================================
    const Sound = (() => {
      let ctx = null;         // AudioContext（懒加载）
      let masterGain = null;
      let ready = false;

      // 初始化（需在用户手势回调中调用）
      function init() {
        if (ready) return;
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          ctx = new AC();
          masterGain = ctx.createGain();
          masterGain.gain.value = state.muted ? 0 : 0.9;
          masterGain.connect(ctx.destination);
          ready = true;
        } catch (e) { /* 音频不可用则静默降级 */ }
      }

      function resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); }
      function setMuted(m) { if (masterGain) masterGain.gain.value = m ? 0 : 0.9; }

      // 通用：一段带包络的振荡器
      function tone(freq, dur, type, vol, slideTo) {
        if (!ready || state.muted) return;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(freq, ctx.currentTime);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), ctx.currentTime + dur);
        g.gain.setValueAtTime(vol || 0.3, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
        o.connect(g); g.connect(masterGain);
        o.start(); o.stop(ctx.currentTime + dur);
      }

      // 通用：噪声（用于破碎、拍击等冲击感）
      function noise(dur, vol, filterFreq) {
        if (!ready || state.muted) return;
        const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
        const src = ctx.createBufferSource(); src.buffer = buf;
        const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filterFreq || 1200;
        const g = ctx.createGain(); g.gain.value = vol || 0.4;
        src.connect(f); f.connect(g); g.connect(masterGain);
        src.start(); src.stop(ctx.currentTime + dur);
      }

      // 撞击：力度越大越闷越响
      function impact(force) {
        const f = Math.max(0.2, Math.min(1, force));
        tone(90 + f * 40, 0.12, 'sine', 0.35 * f + 0.1, 40);
        noise(0.08, 0.25 * f, 700);
      }
      // 破碎：按材质区分音色
      function breakSound(mat) {
        switch (mat) {
          case 'glass':   tone(2200, 0.28, 'triangle', 0.25, 600); noise(0.3, 0.5, 5000); break;
          case 'metal':   tone(1400, 0.4, 'square', 0.2, 500); noise(0.12, 0.3, 3000); break;
          case 'wood':    tone(180, 0.2, 'sawtooth', 0.3, 60); noise(0.14, 0.35, 500); break;
          case 'plastic': tone(700, 0.14, 'square', 0.18, 300); noise(0.1, 0.25, 1800); break;
          default:        noise(0.2, 0.4, 2500);
        }
      }
      // 甩动/呼啸
      function whoosh() { tone(300, 0.22, 'sine', 0.12, 900); }
      // 小人哀嚎（滑稽下滑音）
      function cry() { tone(500, 0.35, 'sawtooth', 0.22, 120); tone(760, 0.25, 'triangle', 0.12, 200); }
      // 抓取
      function grab() { tone(400, 0.08, 'triangle', 0.18, 600); }

      return { init, resume, setMuted, impact, breakSound, whoosh, cry, grab };
    })();

    // ============================================================
    // 【粒子动画模块】碎片受重力下落、旋转、淡出并自动清除
    // ============================================================
    const GRAVITY = 1800; // 像素/秒²

    // 生成某材质的破碎碎片
    function spawnDebris(x, y, mat, power) {
      const m = MATERIALS[mat] || MATERIALS.plastic;
      if (!m.breakable) return; // 卡通皮肤不产生碎片
      const count = Math.round(m.shards * (0.7 + power));
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const sp = 120 + Math.random() * 420 * (0.5 + power);
        state.particles.push({
          x, y,
          vx: Math.cos(ang) * sp,
          vy: Math.sin(ang) * sp - 150,
          rot: Math.random() * Math.PI * 2,
          vr: (Math.random() - 0.5) * 12,
          w: 6 + Math.random() * 14,
          h: 6 + Math.random() * 14,
          color: m.color,
          life: 1, decay: 0.5 + Math.random() * 0.5,
          shape: mat === 'glass' ? 'shard' : 'rect',
        });
      }
      // 撞击尘土/闪光
      for (let i = 0; i < 8; i++) {
        state.particles.push({
          x, y, vx: (Math.random() - 0.5) * 260, vy: -Math.random() * 220,
          rot: 0, vr: 0, w: 3 + Math.random() * 4, h: 3 + Math.random() * 4,
          color: '#ffffff', life: 1, decay: 2.4, shape: 'dot',
        });
      }
    }

    // 飘字/表情气泡
    function spawnFloater(x, y, text, color) {
      state.floaters.push({ x, y, text, color: color || '#fff', life: 1 });
    }

    // 每帧更新粒子物理
    function updateParticles(dt) {
      for (const p of state.particles) {
        p.vy += GRAVITY * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;
        p.life -= p.decay * dt;
        if (p.y > CANVAS_H + 40) p.life = 0; // 落出屏幕即清除
      }
      state.particles = state.particles.filter(p => p.life > 0);
      for (const f of state.floaters) { f.y -= 40 * dt; f.life -= dt; }
      state.floaters = state.floaters.filter(f => f.life > 0);
    }

    // 绘制粒子层
    function drawParticles() {
      for (const p of state.particles) {
        sctx.save();
        sctx.globalAlpha = Math.max(0, Math.min(1, p.life));
        sctx.translate(p.x, p.y);
        sctx.rotate(p.rot);
        sctx.fillStyle = p.color;
        if (p.shape === 'dot') {
          sctx.beginPath(); sctx.arc(0, 0, p.w, 0, Math.PI * 2); sctx.fill();
        } else if (p.shape === 'shard') {
          sctx.beginPath();
          sctx.moveTo(0, -p.h); sctx.lineTo(p.w, p.h); sctx.lineTo(-p.w * 0.6, p.h * 0.4);
          sctx.closePath(); sctx.fill();
        } else {
          sctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        }
        sctx.restore();
      }
      // 飘字
      for (const f of state.floaters) {
        sctx.save();
        sctx.globalAlpha = Math.max(0, f.life);
        sctx.font = 'bold 30px "Comic Sans MS", sans-serif';
        sctx.fillStyle = f.color;
        sctx.textAlign = 'center';
        sctx.strokeStyle = 'rgba(0,0,0,.5)'; sctx.lineWidth = 4;
        sctx.strokeText(f.text, f.x, f.y);
        sctx.fillText(f.text, f.x, f.y);
        sctx.restore();
      }
    }

    // ============================================================
    // 【场景对象模块】定义物体、绘制卡通形象、管理状态与物理
    // ============================================================

    // 根据材质得到上色调（用于差异化视觉）
    function materialPalette(mat) {
      switch (mat) {
        case 'glass':   return { alpha: 0.65, shine: '#e0f7ff', tint: '#bff3ff' };
        case 'metal':   return { alpha: 1.0,  shine: '#ffffff', tint: '#c7d0da' };
        case 'wood':    return { alpha: 1.0,  shine: '#e0b884', tint: '#a9703a' };
        case 'skin':    return { alpha: 1.0,  shine: '#ffd9c0', tint: '#ffc4a3' };
        default:        return { alpha: 1.0,  shine: '#ffffff', tint: null }; // plastic
      }
    }

    // 创建一个场景对象
    function makeObj(o) {
      return Object.assign({
        id: 'obj_' + Math.random().toString(36).slice(2, 8),
        kind: 'item', mat: 'plastic',
        x: 0, y: 0, w: 80, h: 80, rot: 0,
        vx: 0, vy: 0, vr: 0,
        state: 'idle', anim: 0, face: 'calm',
        removable: true, // 是否可被彻底打碎移除
      }, o);
    }

    // 构建办公室场景
    function buildOffice() {
      const deskY = 500;
      return [
        makeObj({ name: '办公桌', shape: 'desk', x: 640, y: deskY + 60, w: 720, h: 150, mat: 'wood', base: true }),
        makeObj({ name: '电脑', shape: 'computer', x: 430, y: deskY - 60, w: 180, h: 150, mat: 'plastic' }),
        makeObj({ name: '水杯', shape: 'cup', x: 760, y: deskY - 40, w: 70, h: 90, mat: 'glass' }),
        makeObj({ name: '文件夹', shape: 'folder', x: 900, y: deskY - 20, w: 110, h: 70, mat: 'plastic' }),
        makeObj({ name: '台灯', shape: 'lamp', x: 300, y: deskY - 90, w: 100, h: 170, mat: 'metal' }),
        makeObj({ name: '老板小人', shape: 'boss', kind: 'person', x: 1080, y: deskY - 60, w: 130, h: 240, mat: 'skin' }),
      ];
    }

    // 构建空发泄房场景
    function buildRoom() {
      const floorY = 560;
      return [
        makeObj({ name: '玻璃瓶', shape: 'bottle', x: 420, y: floorY - 90, w: 80, h: 180, mat: 'glass' }),
        makeObj({ name: '盘子', shape: 'plate', x: 640, y: floorY - 30, w: 150, h: 60, mat: 'glass' }),
        makeObj({ name: '木板', shape: 'plank', x: 860, y: floorY - 40, w: 240, h: 60, mat: 'wood' }),
        makeObj({ name: '塑料桶', shape: 'bucket', x: 1050, y: floorY - 80, w: 130, h: 160, mat: 'plastic' }),
      ];
    }

    // 切换场景
    function setScene(name) {
      state.scene = name;
      state.objects = name === 'office' ? buildOffice() : buildRoom();
      state.particles = [];
      state.floaters = [];
      state.selectedId = null;
      grabbed = null;
      refreshObjectSelect();
      updateTargetUI();
      if (typeof highlightMat === 'function') highlightMat(null); // 清除残留材质高亮
    }

    // 获取选中对象
    function selectedObj() {
      return state.objects.find(o => o.id === state.selectedId) || null;
    }

    // 命中测试：点中某个对象（从上层到下层）
    function pickObject(mx, my) {
      for (let i = state.objects.length - 1; i >= 0; i--) {
        const o = state.objects[i];
        if (o.state === 'broken' || o.base) continue; // 基础桌面不可选中丢弃
        if (Math.abs(mx - o.x) < o.w / 2 + 8 && Math.abs(my - o.y) < o.h / 2 + 8) return o;
      }
      return null;
    }

    // ------- 具体卡通绘制函数 -------
    const SHAPES = {
      // 办公桌（固定基础，不参与丢弃）
      desk(o) {
        const p = materialPalette(o.mat);
        sctx.save(); sctx.translate(o.x, o.y); sctx.globalAlpha = p.alpha;
        sctx.fillStyle = p.tint || '#c68a4a';
        sctx.fillRect(-o.w / 2, -o.h / 2, o.w, 26);          // 桌面
        sctx.fillStyle = '#8a5a2b';
        sctx.fillRect(-o.w / 2 + 30, -o.h / 2 + 26, 26, o.h); // 左腿
        sctx.fillRect(o.w / 2 - 56, -o.h / 2 + 26, 26, o.h);  // 右腿
        sctx.restore();
      },
      computer(o) {
        const p = materialPalette(o.mat);
        sctx.save(); sctx.translate(o.x, o.y); sctx.globalAlpha = p.alpha;
        sctx.fillStyle = '#334';
        sctx.fillRect(-o.w / 2, -o.h / 2, o.w, o.h - 30);        // 显示器
        sctx.fillStyle = '#5eead4';
        sctx.fillRect(-o.w / 2 + 10, -o.h / 2 + 10, o.w - 20, o.h - 60); // 屏幕
        sctx.fillStyle = '#888';
        sctx.fillRect(-20, o.h / 2 - 30, 40, 16);                // 底座
        sctx.fillRect(-o.w / 2, o.h / 2 - 14, o.w, 14);          // 主机
        sctx.restore();
      },
      cup(o) {
        const p = materialPalette(o.mat);
        sctx.save(); sctx.translate(o.x, o.y); sctx.globalAlpha = p.alpha;
        sctx.fillStyle = p.tint || '#7dd3fc';
        sctx.beginPath();
        sctx.moveTo(-o.w / 2, -o.h / 2); sctx.lineTo(o.w / 2, -o.h / 2);
        sctx.lineTo(o.w / 2 - 10, o.h / 2); sctx.lineTo(-o.w / 2 + 10, o.h / 2);
        sctx.closePath(); sctx.fill();
        sctx.strokeStyle = p.tint || '#7dd3fc'; sctx.lineWidth = 8;
        sctx.beginPath(); sctx.arc(o.w / 2 + 4, 0, 18, -Math.PI / 2, Math.PI / 2); sctx.stroke(); // 把手
        sctx.fillStyle = 'rgba(255,255,255,.6)';
        sctx.fillRect(-o.w / 2 + 8, -o.h / 2 + 8, 6, o.h - 24);   // 高光
        sctx.restore();
      },
      folder(o) {
        sctx.save(); sctx.translate(o.x, o.y);
        sctx.fillStyle = '#f59e0b';
        sctx.fillRect(-o.w / 2, -o.h / 2, o.w, o.h);
        sctx.fillStyle = '#d97706';
        sctx.fillRect(-o.w / 2, -o.h / 2 - 10, o.w * 0.5, 14);
        sctx.fillStyle = '#fff';
        sctx.fillRect(-o.w / 2 + 12, -o.h / 2 + 16, o.w - 24, 8);
        sctx.restore();
      },
      lamp(o) {
        const p = materialPalette(o.mat);
        sctx.save(); sctx.translate(o.x, o.y);
        sctx.strokeStyle = p.tint || '#94a3b8'; sctx.lineWidth = 8;
        sctx.beginPath(); sctx.moveTo(0, o.h / 2); sctx.lineTo(0, -o.h / 2 + 30); sctx.stroke(); // 灯杆
        sctx.fillStyle = '#64748b';
        sctx.beginPath(); sctx.ellipse(0, o.h / 2, 34, 10, 0, 0, Math.PI * 2); sctx.fill(); // 底座
        sctx.fillStyle = p.tint || '#fbbf24';
        sctx.beginPath(); // 灯罩
        sctx.moveTo(-40, -o.h / 2 + 30); sctx.lineTo(40, -o.h / 2 + 30);
        sctx.lineTo(20, -o.h / 2 - 10); sctx.lineTo(-20, -o.h / 2 - 10); sctx.closePath(); sctx.fill();
        sctx.restore();
      },
      // 玻璃瓶
      bottle(o) {
        const p = materialPalette(o.mat);
        sctx.save(); sctx.translate(o.x, o.y); sctx.globalAlpha = p.alpha;
        sctx.fillStyle = p.tint || '#a7f3d0';
        sctx.beginPath();
        sctx.moveTo(-o.w / 2, o.h / 2); sctx.lineTo(-o.w / 2, -o.h / 4);
        sctx.quadraticCurveTo(-o.w / 2, -o.h / 2, -14, -o.h / 2);
        sctx.lineTo(-14, -o.h / 2 - 20); sctx.lineTo(14, -o.h / 2 - 20); sctx.lineTo(14, -o.h / 2);
        sctx.quadraticCurveTo(o.w / 2, -o.h / 2, o.w / 2, -o.h / 4);
        sctx.lineTo(o.w / 2, o.h / 2); sctx.closePath(); sctx.fill();
        sctx.fillStyle = 'rgba(255,255,255,.7)';
        sctx.fillRect(-o.w / 2 + 8, -o.h / 4, 6, o.h / 2 - 10); // 高光
        sctx.restore();
      },
      plate(o) {
        const p = materialPalette(o.mat);
        sctx.save(); sctx.translate(o.x, o.y); sctx.globalAlpha = p.alpha;
        sctx.fillStyle = p.tint || '#e2e8f0';
        sctx.beginPath(); sctx.ellipse(0, 0, o.w / 2, o.h / 2, 0, 0, Math.PI * 2); sctx.fill();
        sctx.strokeStyle = '#94a3b8'; sctx.lineWidth = 4;
        sctx.beginPath(); sctx.ellipse(0, 0, o.w / 2 - 18, o.h / 2 - 8, 0, 0, Math.PI * 2); sctx.stroke();
        sctx.restore();
      },
      plank(o) {
        const p = materialPalette(o.mat);
        sctx.save(); sctx.translate(o.x, o.y);
        sctx.fillStyle = p.tint || '#b5651d';
        sctx.fillRect(-o.w / 2, -o.h / 2, o.w, o.h);
        sctx.strokeStyle = 'rgba(0,0,0,.2)'; sctx.lineWidth = 3;
        for (let i = 1; i < 4; i++) { sctx.beginPath(); sctx.moveTo(-o.w / 2, -o.h / 2 + i * o.h / 4); sctx.lineTo(o.w / 2, -o.h / 2 + i * o.h / 4); sctx.stroke(); }
        sctx.restore();
      },
      bucket(o) {
        const p = materialPalette(o.mat);
        sctx.save(); sctx.translate(o.x, o.y);
        sctx.fillStyle = p.tint || '#38bdf8';
        sctx.beginPath();
        sctx.moveTo(-o.w / 2, -o.h / 2); sctx.lineTo(o.w / 2, -o.h / 2);
        sctx.lineTo(o.w / 2 - 20, o.h / 2); sctx.lineTo(-o.w / 2 + 20, o.h / 2); sctx.closePath(); sctx.fill();
        sctx.strokeStyle = '#0ea5e9'; sctx.lineWidth = 8;
        sctx.beginPath(); sctx.arc(0, -o.h / 2, o.w / 2 - 6, Math.PI, 0); sctx.stroke(); // 提手
        sctx.restore();
      },
      // 老板小人（卡通，无血腥）
      boss(o) {
        const hurt = o.face === 'hurt';
        const fear = o.face === 'fear';
        sctx.save(); sctx.translate(o.x, o.y);
        // 身体（西装）
        sctx.fillStyle = '#3b4a6b';
        sctx.beginPath();
        sctx.moveTo(-o.w / 2, o.h / 2); sctx.lineTo(-o.w / 2 + 10, -o.h / 6);
        sctx.lineTo(o.w / 2 - 10, -o.h / 6); sctx.lineTo(o.w / 2, o.h / 2); sctx.closePath(); sctx.fill();
        // 领带
        sctx.fillStyle = '#ef4444';
        sctx.beginPath(); sctx.moveTo(0, -o.h / 6); sctx.lineTo(-10, 0); sctx.lineTo(0, o.h / 3); sctx.lineTo(10, 0); sctx.closePath(); sctx.fill();
        // 头
        sctx.fillStyle = '#ffcc99';
        sctx.beginPath(); sctx.arc(0, -o.h / 3, 42, 0, Math.PI * 2); sctx.fill();
        // 眼睛
        sctx.fillStyle = '#222';
        if (hurt) {
          sctx.lineWidth = 4; sctx.strokeStyle = '#222';
          [-16, 16].forEach(dx => { sctx.beginPath(); sctx.moveTo(dx - 7, -o.h / 3 - 8); sctx.lineTo(dx + 7, -o.h / 3 + 2); sctx.moveTo(dx + 7, -o.h / 3 - 8); sctx.lineTo(dx - 7, -o.h / 3 + 2); sctx.stroke(); });
        } else {
          const ex = fear ? 3 : 0;
          [-16, 16].forEach(dx => { sctx.beginPath(); sctx.arc(dx, -o.h / 3 - 3, fear ? 7 : 5, 0, Math.PI * 2); sctx.fill(); if (fear) { sctx.fillStyle = '#fff'; sctx.beginPath(); sctx.arc(dx + ex, -o.h / 3 - 4, 2, 0, Math.PI * 2); sctx.fill(); sctx.fillStyle = '#222'; } });
        }
        // 嘴巴
        sctx.strokeStyle = '#222'; sctx.lineWidth = 4;
        sctx.beginPath();
        if (hurt) sctx.arc(0, -o.h / 3 + 26, 10, Math.PI, 0);          // 痛嘴
        else if (fear) { sctx.fillStyle = '#222'; sctx.beginPath(); sctx.ellipse(0, -o.h / 3 + 22, 8, 11, 0, 0, Math.PI * 2); sctx.fill(); } // 惊呆
        else sctx.arc(0, -o.h / 3 + 14, 14, 0.15 * Math.PI, 0.85 * Math.PI); // 微笑
        sctx.stroke();
        sctx.restore();
      },
    };

    // 绘制单个对象（包含状态动画）
    function drawObject(o, time) {
      if (o.state === 'broken') return;
      sctx.save();
      // 震动/害怕/受伤时的位移与旋转
      let ox = 0, oy = 0, orot = o.rot;
      if (o.state === 'shake') { const d = o.anim; ox = Math.sin(time * 45) * 8 * d; orot += Math.sin(time * 30) * 0.1 * d; }
      if (o.state === 'fear') { ox = Math.sin(time * 30) * 3; oy = Math.cos(time * 26) * 2; }
      if (o.state === 'hurt') { orot += -0.35 * o.anim; oy = -6 * o.anim; }
      sctx.translate(o.x + ox, o.y + oy);
      sctx.rotate(orot);
      sctx.translate(-o.x, -o.y);
      // 选中高亮光环
      if (o.id === state.selectedId && !o.base) {
        sctx.save();
        sctx.strokeStyle = 'rgba(251,191,36,.9)'; sctx.lineWidth = 4; sctx.setLineDash([10, 8]);
        sctx.strokeRect(o.x - o.w / 2 - 6, o.y - o.h / 2 - 6, o.w + 12, o.h + 12);
        sctx.restore();
      }
      (SHAPES[o.shape] || (() => {}))(o);
      sctx.restore();
    }

    // ============================================================
    // 【灯光材质模块】背景绘制 + 实时光照氛围叠加
    // ============================================================
    function drawBackground() {
      // 墙面
      const wall = sctx.createLinearGradient(0, 0, 0, CANVAS_H);
      if (state.scene === 'office') { wall.addColorStop(0, '#dbeafe'); wall.addColorStop(1, '#bfdbfe'); }
      else { wall.addColorStop(0, '#e5e7eb'); wall.addColorStop(1, '#cbd5e1'); }
      sctx.fillStyle = wall;
      sctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      // 地板
      sctx.fillStyle = state.scene === 'office' ? '#94a3b8' : '#9ca3af';
      sctx.fillRect(0, 560, CANVAS_W, CANVAS_H - 560);
      sctx.fillStyle = 'rgba(0,0,0,.06)';
      for (let x = 0; x < CANVAS_W; x += 80) sctx.fillRect(x, 560, 2, CANVAS_H - 560);
      // 办公室窗户/发泄房标语
      if (state.scene === 'office') {
        sctx.fillStyle = '#bae6fd'; sctx.fillRect(60, 90, 240, 160);
        sctx.strokeStyle = '#fff'; sctx.lineWidth = 6; sctx.strokeRect(60, 90, 240, 160);
        sctx.beginPath(); sctx.moveTo(180, 90); sctx.lineTo(180, 250); sctx.moveTo(60, 170); sctx.lineTo(300, 170); sctx.stroke();
      } else {
        sctx.fillStyle = 'rgba(239,68,68,.25)';
        sctx.font = 'bold 40px "Comic Sans MS"'; sctx.textAlign = 'center';
        sctx.fillText('😤 尽情发泄 · 安全第一', CANVAS_W / 2, 160);
      }
    }

    // 光照叠加（强度控制明暗、暖/冷光改变色调、环境氛围光）
    function drawLighting() {
      const i = clamp(state.light.intensity / 100, 0, 1);
      sctx.save();
      // 环境氛围光：从顶部中心的径向光晕
      if (state.light.ambient) {
        const g = sctx.createRadialGradient(CANVAS_W / 2, 120, 60, CANVAS_W / 2, 300, 900);
        g.addColorStop(0, `rgba(255,${state.light.warm ? 230 : 245},${state.light.warm ? 180 : 255},${0.25 * i})`);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        sctx.fillStyle = g; sctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      }
      // 暖/冷光色调
      sctx.fillStyle = state.light.warm ? 'rgba(255,150,40,0.10)' : 'rgba(40,120,255,0.10)';
      sctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      // 亮度不足时压暗
      const darkness = 1 - i;
      if (darkness > 0) { sctx.fillStyle = `rgba(6,8,20,${darkness * 0.82})`; sctx.fillRect(0, 0, CANVAS_W, CANVAS_H); }
      sctx.restore();
    }

    // ============================================================
    // 【动作效果模块】手势/鼠标统一调用的破坏行为
    // ============================================================
    function setAnim(o, st) { o.state = st; o.anim = 1; }

    // 彻底摧毁对象（破碎移除）
    function destroyObject(o) {
      if (o.state === 'broken') return;
      spawnDebris(o.x, o.y, o.mat, 1);
      Sound.breakSound(o.mat);
      o.state = 'broken';
      if (o.id === state.selectedId) { state.selectedId = null; updateTargetUI(); }
      state.breakCount++;
      updateBreakUI();
    }

    // 小人受伤反馈（不破坏，仅后仰 + 痛表情）
    function hurtPerson(o, force) {
      o.face = 'hurt'; setAnim(o, 'hurt');
      Sound.cry();
      spawnFloater(o.x, o.y - o.h / 2, ['哎呦!', '饶命!', '啊啊!', '😵'][Math.floor(Math.random() * 4)], '#fca5a5');
      state.shake = Math.max(state.shake, 4 + force * 8);
    }

    // 握拳挥拳：击打
    function actHit(o, force) {
      if (!o || o.state === 'broken') return;
      state.shake = Math.max(state.shake, 6 + force * 14);
      Sound.impact(force);
      if (o.kind === 'person') { hurtPerson(o, force); return; }
      spawnDebris(o.x, o.y - o.h * 0.2, o.mat, force * 0.25);
      setAnim(o, 'shake');
      o.hp = (o.hp == null ? 100 : o.hp) - force * 55;
      if (o.hp <= 0 && MATERIALS[o.mat].breakable) destroyObject(o);
    }

    // 抓起（开始拖动）
    function actGrab(o) {
      if (!o || o.state === 'broken') return;
      Sound.grab();
      if (o.kind !== 'person') { setAnim(o, 'shake'); }
    }

    // 甩出：根据速度飞物体
    function actThrow(o, vx, vy) {
      if (!o) return;
      o.state = 'fly'; o.vx = vx; o.vy = vy; o.vr = clamp(vx / 400, -0.25, 0.25);
      Sound.whoosh();
    }

    // 手掌向下猛拍：砸目标
    function actSlap(o) {
      if (!o || o.state === 'broken') return;
      state.shake = Math.max(state.shake, 18);
      Sound.impact(1);
      if (o.kind === 'person') { o.face = 'hurt'; setAnim(o, 'shake'); Sound.cry(); spawnFloater(o.x, o.y - o.h / 2, '🤚 抱头!', '#fca5a5'); return; }
      // 物体弹飞
      o.state = 'fly'; o.vy = -500; o.vx = rand(-200, 200); o.vr = rand(-6, 6);
      spawnDebris(o.x, o.y, o.mat, 0.4);
    }

    // 手掌向前推：推飞目标
    function actPush(o) {
      if (!o || o.state === 'broken') return;
      Sound.whoosh();
      if (o.kind === 'person') { hurtPerson(o, 0.6); o.vx = 300; setAnim(o, 'hurt'); return; }
      o.state = 'fly'; o.vx = 600; o.vy = -200; o.vr = 4;
    }

    // 双手横扫：扫落选中及周围物体
    function actSweep(handY) {
      state.shake = Math.max(state.shake, 16);
      Sound.impact(1);
      const band = state.objects.filter(o => o.state !== 'broken' && !o.base && Math.abs(o.y - handY) < 160);
      band.forEach((o, idx) => {
        if (o.kind === 'person') { hurtPerson(o, 1); return; }
        o.state = 'fly'; o.vx = 700 + idx * 40; o.vy = -260 - Math.random() * 120; o.vr = rand(-8, 8);
        spawnDebris(o.x, o.y, o.mat, 0.3);
      });
      if (band.length) spawnFloater(CANVAS_W / 2, handY - 60, '💨 横扫!', '#fdba74');
    }

    // 张开手掌靠近：吓一吓目标
    function actScare(o) {
      if (!o || o.state === 'broken') return;
      o.face = 'fear'; setAnim(o, 'fear');
      if (o.kind === 'person') spawnFloater(o.x, o.y - o.h / 2, '😱!', '#fecaca');
      else spawnFloater(o.x, o.y - o.h / 2, '❗', '#e2e8f0');
    }

    // 逐帧更新对象物理与动画
    function updateObjects(dt) {
      const floorY = state.scene === 'office' ? 560 : 590;
      for (const o of state.objects) {
        if (o.state === 'broken') continue;
        // 动画衰减
        if (o.state === 'shake' || o.state === 'hurt' || o.state === 'fear') {
          o.anim -= dt * 2.2;
          if (o.anim <= 0) { o.state = 'idle'; o.anim = 0; o.face = 'calm'; }
        }
        // 飞体物理
        if (o.state === 'fly') {
          o.vy += GRAVITY * dt;
          o.x += o.vx * dt;
          o.y += o.vy * dt;
          o.rot += o.vr * dt;
          if (o.y > floorY - o.h / 2) {
            o.y = floorY - o.h / 2;
            if (Math.abs(o.vy) > 250 && MATERIALS[o.mat].breakable) { destroyObject(o); }
            else { o.vy *= -0.4; o.vx *= 0.7; if (Math.abs(o.vy) < 60) { o.state = 'idle'; o.rot = 0; } }
          }
          if (o.x < -80 || o.x > CANVAS_W + 80) destroyObject(o);
        }
      }
    }

    // ============================================================
    // 【手势识别模块】MediaPipe Hands → 手势分类 → 分发动作
    // ============================================================
    let hands = null;         // MediaPipe Hands 实例
    let pose = null;          // MediaPipe Pose 实例（人体骨架）
    let poseReady = false;    // Pose 是否已初始化
    let lastPoseLandmarks = null; // 最近一帧人体 33 点 landmarks
    let mpCamera = null;      // Camera 工具循环
    let videoStream = null;
    let handsReady = false;
    const handCursor = { x: CANVAS_W / 2, y: CANVAS_H / 2, active: false };
    let prevWrist = null;     // 上一帧手腕 {x,y,z,t} 用于测速
    let pinchHeld = false;    // 当前是否处于捏合抓取
    const cooldown = {};      // 各手势冷却时间
    let lastLandmarks = null; // 最近一帧手部 landmarks，用于主画面骨骼叠加
    let handsDetected = 0;    // 当前检测到的手数量
    let curPose = '待机';     // 当前识别到的姿势（HUD 展示）
    let engineState = 'idle'; // idle | loading | ok | failed
    let healthTimer = 0;
    let resultsCount = 0;     // onResults 被回调次数（判断推理循环是否在跑）
    let dbgVisible = true;    // 调试面板开关（按 D 切换）
    let dbg = { hands: 0, pose: '-', ext: '-', pinch: '-', palm: '-', target: '-' }; // 调试面板数据

    function canFire(name, ms) {
      const t = performance.now();
      if (cooldown[name] && t - cooldown[name] < ms) return false;
      cooldown[name] = t; return true;
    }

    // 手指是否伸展（指尖比指节远离手腕）
    function isExt(lm, tip, pip) {
      const w = lm[0];
      return dist(lm[tip], w) > dist(lm[pip], w) * 1.12;
    }
    function isFist(lm) {
      const e = [isExt(lm, 8, 6), isExt(lm, 12, 10), isExt(lm, 16, 14), isExt(lm, 20, 18)];
      return e.filter(Boolean).length <= 1; // 至多一根手指伸展
    }
    function isOpenPalm(lm) {
      const e = [isExt(lm, 8, 6), isExt(lm, 12, 10), isExt(lm, 16, 14), isExt(lm, 20, 18)];
      return e.filter(Boolean).length >= 4; // 四指全张
    }
    function isPinch(lm) {
      const size = dist(lm[0], lm[9]) || 1;
      return dist(lm[4], lm[8]) < size * 0.45; // 拇指与食指靠近
    }
    // 手掌中心（掌心近似：中指根部与手腕中点）
    function palmCenter(lm) {
      const mx = (lm[0].x + lm[9].x) / 2, my = (lm[0].y + lm[9].y) / 2;
      // 镜像映射到画布坐标
      return { x: (1 - mx) * CANVAS_W, y: my * CANVAS_H, z: lm[0].z };
    }

    // 分析手部结果→触发手势
    function analyzeHands(res) {
      const all = res.multiHandLandmarks || [];
      handsDetected = all.length; lastLandmarks = all;
      if (engineState !== 'ok') setEngineState('ok');
      if (all.length === 0) { handCursor.active = false; pinchHeld = false; prevWrist = null; setGesture('检测中…无手'); return; }
      const now = performance.now();
      const lm = all[0];
      const pc = palmCenter(lm);
      handCursor.x = pc.x; handCursor.y = pc.y; handCursor.active = true;
    
      // 测速
      let vx = 0, vy = 0, vz = 0, dt = 0.016;
      if (prevWrist) {
        dt = Math.max(0.001, (now - prevWrist.t) / 1000);
        vx = (pc.x - prevWrist.x) / dt;
        vy = (pc.y - prevWrist.y) / dt;
        vz = (pc.z - prevWrist.z) / dt;
      }
      prevWrist = { x: pc.x, y: pc.y, z: pc.z, t: now };
    
      const speedH = Math.abs(vx);
      // 调试：指伸展数、捏合间距（归一化）
      const extCount = [isExt(lm, 8, 6), isExt(lm, 12, 10), isExt(lm, 16, 14), isExt(lm, 20, 18)].filter(Boolean).length;
      const pinchGap = (dist(lm[4], lm[8]) / (dist(lm[0], lm[9]) || 1)).toFixed(2);
      // 目标：优先手动选中，否则就近锁定（半径 500）
      let sel = selectedObj();
      if (!sel) { const near = nearestObj(pc.x, pc.y, 500); if (near) { selectObject(near.id); sel = near; } }
      dbg = { hands: all.length, pose: curPose, ext: extCount + '/4', pinch: pinchGap, palm: Math.round(pc.x) + ',' + Math.round(pc.y), target: sel ? sel.name : '无' };
      
      // 1) 双手横扫：两只手且快速横向移动
      if (all.length >= 2 && speedH > 350 && canFire('sweep', 600)) {
        actSweep(pc.y); setGesture('双手横扫'); return;
      }
      // 2) 握拳→连续击打（姿态保持式，握住就一直打，无需快速挥动）
      if (isFist(lm)) {
        setGesture('握拳');
        if (canFire('hit', 340)) { const t = sel || nearestObj(pc.x, pc.y, 99999); if (t) actHit(t, 0.85); }
        return;
      }
      // 3) 捏合抓取：抓住/就近物体，拖动，松开甩出
      if (isPinch(lm)) {
        if (!pinchHeld) {
          let target = sel && Math.abs(sel.x - pc.x) < 320 ? sel : (pickObject(pc.x, pc.y) || nearestObj(pc.x, pc.y, 320));
          if (target) {
            if (state.selectedId !== target.id) { selectObject(target.id); }
            grabbed = { obj: target, offX: target.x - pc.x, offY: target.y - pc.y, lastX: pc.x, lastY: pc.y, vx: 0, vy: 0 };
            actGrab(target);
          }
        } else if (grabbed) {
          grabbed.obj.x = pc.x + grabbed.offX;
          grabbed.obj.y = pc.y + grabbed.offY;
          grabbed.vx = (pc.x - grabbed.lastX) / dt; grabbed.vy = (pc.y - grabbed.lastY) / dt;
          grabbed.lastX = pc.x; grabbed.lastY = pc.y;
        }
        pinchHeld = true; setGesture('捏合抓取'); return;
      } else if (pinchHeld) {
        pinchHeld = false;
        if (grabbed) { actThrow(grabbed.obj, clamp(grabbed.vx, -1200, 1200), clamp(grabbed.vy - 200, -1200, 1200)); grabbed = null; }
      }
      // 4) 手掌向下猛拍：张开手 + 向下高速
      if (isOpenPalm(lm) && vy > 500 && canFire('slap', 500)) {
        const t = sel || nearestObj(pc.x, pc.y, 99999);
        if (t) { actSlap(t); setGesture('下拍'); }
        return;
      }
      // 5) 手掌向前推送：z 快速减小（靠近镜头）
      if (isOpenPalm(lm) && vz < -0.9 && canFire('push', 500)) {
        const t = sel || nearestObj(pc.x, pc.y, 99999);
        if (t) { actPush(t); setGesture('前推'); }
        return;
      }
      // 6) 张开手掌保持→吓一吓（姿态保持式）
      if (isOpenPalm(lm)) {
        setGesture('张掌');
        if (canFire('scare', 1200)) { const t = sel || nearestObj(pc.x, pc.y, 99999); if (t) actScare(t); }
        return;
      }
      setGesture('手(' + extCount + '/4指)');
    }

    // 就近物体（排除基础桌面/已碎）
    function nearestObj(x, y, maxR) {
      let best = null, bd = maxR;
      for (const o of state.objects) {
        if (o.state === 'broken' || o.base) continue;
        const d = Math.hypot(o.x - x, o.y - y);
        if (d < bd) { bd = d; best = o; }
      }
      return best;
    }

    // 在预览窗口绘制手部骨架（21 点）
    function drawHandSkeleton(ctx, W, H, handsArr) {
      const CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
      for (const lm of (handsArr || [])) {
        ctx.strokeStyle = '#f97316'; ctx.lineWidth = 2;
        for (const [a, b] of CONN) { ctx.beginPath(); ctx.moveTo(lm[a].x * W, lm[a].y * H); ctx.lineTo(lm[b].x * W, lm[b].y * H); ctx.stroke(); }
        ctx.fillStyle = '#fbbf24';
        for (const p of lm) { ctx.beginPath(); ctx.arc(p.x * W, p.y * H, 3, 0, Math.PI * 2); ctx.fill(); }
      }
    }

    // 在预览窗口绘制人体骨架（MediaPipe Pose 33 点，随人移动而动）
    function drawPoseSkeleton(ctx, W, H, lm) {
      if (!lm || !lm.length) return;
      // 躯干/四肢/头部主要关节连线（COCO 风格）
      const CONN = [
        [0,1],[0,2],[1,2],[1,3],[2,4],           // 头部
        [0,5],[0,6],[5,6],                        // 肩线
        [5,7],[7,9],[6,8],[8,10],                 // 手臂
        [9,10],                                   // 手腕连线
        [5,11],[6,12],[11,12],                    // 躯干
        [11,13],[13,15],[12,14],[14,16],          // 腿
        [15,17],[15,19],[17,19],[16,18],[16,20],[18,20], // 脚
      ];
      const vis = (i) => lm[i] && (lm[i].visibility === undefined || lm[i].visibility > 0.5);
      // 连线
      ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.strokeStyle = '#22d3ee';
      for (const [a, b] of CONN) {
        if (vis(a) && vis(b)) { ctx.beginPath(); ctx.moveTo(lm[a].x * W, lm[a].y * H); ctx.lineTo(lm[b].x * W, lm[b].y * H); ctx.stroke(); }
      }
      // 关节点
      for (let i = 0; i < lm.length; i++) {
        if (!vis(i)) continue;
        ctx.fillStyle = i <= 10 ? '#f472b6' : '#22d3ee';
        ctx.beginPath(); ctx.arc(lm[i].x * W, lm[i].y * H, i === 0 ? 6 : 4, 0, Math.PI * 2); ctx.fill();
      }
    }

    // 将手部骨骼按真实画面位置叠加绘制到主舞台（营造手势“画中画”反馈）
    function drawHandOnStage() {
      if (!lastLandmarks || lastLandmarks.length === 0) return;
      const CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
      sctx.save();
      sctx.globalAlpha = 0.75; sctx.lineWidth = 5; sctx.lineCap = 'round';
      for (const lm of lastLandmarks) {
        const P = (i) => ({ x: (1 - lm[i].x) * CANVAS_W, y: lm[i].y * CANVAS_H });
        sctx.strokeStyle = '#fbbf24';
        for (const [a, b] of CONN) { const pa = P(a), pb = P(b); sctx.beginPath(); sctx.moveTo(pa.x, pa.y); sctx.lineTo(pb.x, pb.y); sctx.stroke(); }
        sctx.fillStyle = '#f97316';
        for (let i = 0; i < 21; i++) { const p = P(i); sctx.beginPath(); sctx.arc(p.x, p.y, 6, 0, Math.PI * 2); sctx.fill(); }
      }
      sctx.restore();
    }

    // 左下角常驻调试面板（便于定位手势问题，按 D 开关）
    function drawDebug() {
      if (!dbgVisible) return;
      const x = 14, y = CANVAS_H - 138, w = 330, h = 124;
      sctx.save();
      sctx.fillStyle = 'rgba(0,0,0,.72)';
      sctx.beginPath(); sctx.roundRect ? sctx.roundRect(x, y, w, h, 10) : sctx.rect(x, y, w, h); sctx.fill();
      sctx.strokeStyle = 'rgba(251,191,36,.5)'; sctx.lineWidth = 2;
      sctx.beginPath(); sctx.roundRect ? sctx.roundRect(x, y, w, h, 10) : sctx.rect(x, y, w, h); sctx.stroke();
      sctx.font = '15px Consolas, monospace'; sctx.textAlign = 'left'; sctx.textBaseline = 'top';
      const engCol = engineState === 'ok' ? '#4ade80' : (engineState === 'failed' ? '#f87171' : '#fbbf24');
      sctx.fillStyle = '#fbbf24'; sctx.fillText('🔧 调试面板 (按 D 关闭)', x + 12, y + 10);
      sctx.fillStyle = engCol; sctx.fillText('引擎: ' + engineState + '  帧:' + resultsCount, x + 12, y + 34);
      sctx.fillStyle = '#fff'; sctx.fillText('手: ' + dbg.hands + '   姿势: ' + curPose, x + 12, y + 58);
      sctx.fillText('指伸: ' + dbg.ext + '  捏距: ' + dbg.pinch, x + 12, y + 82);
      sctx.fillText('掌心: ' + dbg.palm + '  目标: ' + dbg.target, x + 12, y + 106);
      sctx.restore();
    }

    // 初始化 MediaPipe Hands
    async function initHands() {
      if (handsReady) return true;
      if (typeof Hands === 'undefined') { setCamTip('❗手势库未能加载，请检查网络；可用鼠标拖拽发泄'); return false; }
      try {
        hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}` });
        hands.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults((res) => {
          lastResultTime = performance.now(); resultsCount++;
          analyzeHands(res);
        });
        handsReady = true; return true;
      } catch (e) { setCamTip('❗手势初始化失败'); return false; }
    }

    // 初始化 MediaPipe Pose（人体骨架），失败不影响手势/预览
    async function initPose() {
      if (poseReady) return true;
      if (typeof Pose === 'undefined') return false;
      try {
        pose = new Pose({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/${f}` });
        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        pose.onResults((res) => {
          lastResultTime = performance.now();
          lastPoseLandmarks = res.poseLandmarks || null;
        });
        poseReady = true; return true;
      } catch (e) { poseReady = false; return false; }
    }

    let camLoopId = 0;
    let lastResultTime = 0;   // 最近一次收到手势结果的时间戳
    let previewLoopId = 0;

    // 独立预览绘制循环（画中画）：每帧重绘 镜像视频 + 人体骨架 + 手部骨架，骨架随人移动而实时变化
    function previewLoop() {
      if (!state.camOn) return;
      if (camVideo.readyState >= 2) {
        const W = camVideo.videoWidth || 640, H = camVideo.videoHeight || 480;
        if (camCanvas.width !== W) { camCanvas.width = W; camCanvas.height = H; }
        cctx.save();
        cctx.translate(W, 0); cctx.scale(-1, 1); // 镜像，与视频对齐
        cctx.drawImage(camVideo, 0, 0, W, H);
        drawPoseSkeleton(cctx, W, H, lastPoseLandmarks);
        drawHandSkeleton(cctx, W, H, lastLandmarks);
        cctx.restore();
      }
      previewLoopId = requestAnimationFrame(previewLoop);
    }

    // 引擎健康检测（可见性感知）：窗口隐藏/后台会冻结 rAF，不能误判为模型加载失败
    function scheduleEngineCheck() {
      if (healthTimer) clearTimeout(healthTimer);
      healthTimer = setTimeout(checkEngineHealth, 8000);
    }
    function checkEngineHealth() {
      if (!state.camOn) return;
      if (lastResultTime) { setEngineState('ok'); return; }
      if (document.hidden || document.visibilityState !== 'visible') { scheduleEngineCheck(); return; }
      setEngineState('failed');
      setCamTip('⚠️ 手势模型未能加载（多为网络无法下载模型文件）\n请用鼠标拖拽物体发泄，或检查网络后刷新重试');
    }
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && state.camOn && !lastResultTime) scheduleEngineCheck();
    });

    async function startCamera() {
      state.camOn = true; updateCamBtn();
      camBox.classList.remove('hidden-preview'); setCamTip('');
      Sound.init();
      previewLoop();
      // 安全上下文检测：file:// 双击打开时浏览器会禁用摄像头
      const insecure = !window.isSecureContext && location.protocol !== 'https:';
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setCamTip('❌ 当前环境不支持摄像头。请勿直接双击打开，请用本地服务器：\npython -m http.server 8000\n然后访问 http://localhost:8000');
        state.camOn = false; updateCamBtn();
        spawnFloater(CANVAS_W / 2, 200, '请用 http://localhost 打开才能用摄像头', '#fde68a');
        return;
      }
      if (insecure) {
        setCamTip('⚠️ 非安全上下文，摄像头可能被拦截，请改用 http://localhost 或 https 访问');
      }
      if (!(await initHands())) return;
      await initPose();
      const feed = async () => {
        try { await hands.send({ image: camVideo }); } catch (e) { /* 模型失败不阻断预览 */ }
        try { if (pose) await pose.send({ image: camVideo }); } catch (e) { /* 同上 */ }
      };
      setEngineState('loading');
      // 健康检测（可见性感知）
      scheduleEngineCheck();
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
        camVideo.srcObject = videoStream;
        await camVideo.play();
        // ⚠️ 用 requestAnimationFrame 自己驱动喂帧（不用 Camera 工具，避免其构造签名差异导致 onFrame 从不触发）
        const loop = async () => {
          if (!state.camOn) return;
          if (camVideo.readyState >= 2) await feed();
          camLoopId = requestAnimationFrame(loop);
        };
        loop();
      } catch (e) {
        const reason = e && e.name === 'NotAllowedError' ? '摄像头权限被拒绝，请在浏览器地址栏允许访问' :
          (e && e.name === 'NotFoundError' ? '未检测到摄像头设备' : ('启动失败：' + (e && e.message ? e.message : e)));
        setCamTip('❌ ' + reason + '\n仍可用鼠标拖拽物体发泄');
        state.camOn = false; updateCamBtn();
      }
    }

    function stopCamera() {
      state.camOn = false; updateCamBtn();
      camBox.classList.add('hidden-preview');
      handCursor.active = false; lastLandmarks = null; handsDetected = 0;
      lastPoseLandmarks = null;
      if (healthTimer) clearTimeout(healthTimer); setEngineState('idle'); setGesture('待机');
      if (previewLoopId) cancelAnimationFrame(previewLoopId);
      if (mpCamera) { try { mpCamera.stop(); } catch (e) {} mpCamera = null; }
      if (camLoopId) cancelAnimationFrame(camLoopId);
      if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; }
    }

    // ============================================================
    // 【主渲染循环】
    // ============================================================
    let lastTime = performance.now();
    function frame(t) {
      const dt = Math.min(0.05, (t - lastTime) / 1000); lastTime = t;

      updateObjects(dt);
      // 鼠标拖动跟随（无摄像头时）
      if (grabbed && !handCursor.active) {
        grabbed.obj.x = grabbed.lastX + grabbed.offX; grabbed.obj.y = grabbed.lastY + grabbed.offY;
      }
      updateParticles(dt);
      state.shake = Math.max(0, state.shake - dt * 60);

      // 绘制
      sctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
      sctx.save();
      if (state.shake > 0.5) sctx.translate(rand(-state.shake, state.shake), rand(-state.shake, state.shake));
      drawBackground();
      for (const o of state.objects) drawObject(o, t / 1000);
      drawParticles();
      // 手部光标
      if (handCursor.active) {
        sctx.save(); sctx.strokeStyle = '#f97316'; sctx.lineWidth = 3;
        sctx.beginPath(); sctx.arc(handCursor.x, handCursor.y, 26, 0, Math.PI * 2); sctx.stroke();
        sctx.beginPath(); sctx.moveTo(handCursor.x - 34, handCursor.y); sctx.lineTo(handCursor.x + 34, handCursor.y);
        sctx.moveTo(handCursor.x, handCursor.y - 34); sctx.lineTo(handCursor.x, handCursor.y + 34); sctx.stroke();
        sctx.restore();
        drawHandOnStage(); // 主画面骨骼叠加（手势画中画）
      }
      sctx.restore();
      drawLighting();
      drawDebug(); // 常驻调试面板

      requestAnimationFrame(frame);
    }

    // ============================================================
    // 【UI 绑定】
    // ============================================================
    const uiTarget = document.getElementById('uiTarget');
    const uiBreak = document.getElementById('uiBreak');
    const uiGesture = document.getElementById('uiGesture');
    const hudEngineEl = document.getElementById('hudEngine');
    const hudHandsEl = document.getElementById('hudHands');
    const hudPoseEl = document.getElementById('hudPose');
    const objSelect = document.getElementById('objSelect');
    const camTipEl = document.getElementById('camTip');

    function setGesture(name) {
      uiGesture.textContent = '手势：' + name; curPose = name;
      if (hudPoseEl) hudPoseEl.textContent = name;
      if (hudHandsEl) hudHandsEl.textContent = handsDetected;
    }
    // 更新引擎状态（loading/ok/failed）到 HUD
    function setEngineState(s) {
      engineState = s;
      if (!hudEngineEl) return;
      const map = { idle: ['未启动', 'text-white/60'], loading: ['模型下载中…', 'text-amber-300'], ok: ['就绪', 'text-emerald-400'], failed: ['加载失败', 'text-rose-400'] };
      const m = map[s] || map.idle;
      hudEngineEl.textContent = m[0]; hudEngineEl.className = m[1];
      // 引擎恢复就绪时，清除之前的“加载失败”类提示
      if (s === 'ok' && camTipEl && camTipEl.textContent.includes('模型')) setCamTip('');
    }
    function setCamTip(txt) { camTipEl.style.display = txt ? 'flex' : 'none'; camTipEl.textContent = txt; }
    function updateBreakUI() { uiBreak.textContent = state.breakCount; }
    function updateTargetUI() {
      const o = selectedObj();
      uiTarget.textContent = o ? o.name : '未选择';
      if (o) objSelect.value = o.id;
    }
    // 刷新对象下拉列表
    function refreshObjectSelect() {
      objSelect.innerHTML = '<option value="">-- 选择目标 --</option>' +
        state.objects.filter(o => !o.base && o.state !== 'broken').map(o => `<option value="${o.id}">${o.name}</option>`).join('');
    }
    // 选中对象
    function selectObject(id) {
      state.selectedId = id; updateTargetUI();
      const o = selectedObj();
      if (o) highlightMat(o.mat);
    }

    // 画布鼠标交互（选择 + 拖拽甩出的兵底方案）
    function canvasPos(e) {
      const r = stage.getBoundingClientRect();
      return { x: (e.clientX - r.left) / r.width * CANVAS_W, y: (e.clientY - r.top) / r.height * CANVAS_H };
    }
    stage.addEventListener('mousedown', (e) => {
      Sound.init(); Sound.resume();
      const p = canvasPos(e); const o = pickObject(p.x, p.y);
      if (o) {
        selectObject(o.id); actGrab(o);
        grabbed = { obj: o, offX: o.x - p.x, offY: o.y - p.y, lastX: p.x, lastY: p.y, vx: 0, vy: 0 };
      } else { state.selectedId = null; updateTargetUI(); }
    });
    window.addEventListener('mousemove', (e) => {
      if (!grabbed || handCursor.active) return;
      const p = canvasPos(e);
      grabbed.vx = (p.x - grabbed.lastX); grabbed.vy = (p.y - grabbed.lastY);
      grabbed.lastX = p.x; grabbed.lastY = p.y;
      grabbed.obj.x = p.x + grabbed.offX; grabbed.obj.y = p.y + grabbed.offY;
    });
    window.addEventListener('mouseup', () => {
      if (grabbed && !handCursor.active) {
        const g = grabbed; grabbed = null;
        if (Math.hypot(g.vx, g.vy) > 14) actThrow(g.obj, clamp(g.vx * 22, -1200, 1200), clamp(g.vy * 22 - 150, -1200, 1200));
        else { g.obj.state = 'idle'; g.obj.rot = 0; }
      }
    });
    // 双击快速击打
    stage.addEventListener('dblclick', (e) => {
      const p = canvasPos(e); const o = pickObject(p.x, p.y);
      if (o) { selectObject(o.id); actHit(o, 0.9); }
    });

    // 场景切换
    document.querySelectorAll('.scene-btn').forEach(b => b.addEventListener('click', () => {
      setScene(b.dataset.scene);
      document.querySelectorAll('.scene-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
    }));
    // 对象下拉
    objSelect.addEventListener('change', () => { if (objSelect.value) selectObject(objSelect.value); });
    // 灯光强度
    const lightSlider = document.getElementById('lightSlider');
    const lightVal = document.getElementById('lightVal');
    lightSlider.addEventListener('input', () => { state.light.intensity = +lightSlider.value; lightVal.textContent = lightSlider.value; });
    // 暖/冷光
    const warmBtn = document.getElementById('warmBtn'), coolBtn = document.getElementById('coolBtn');
    function setLightWarm(w) { state.light.warm = w; warmBtn.classList.toggle('active', w); coolBtn.classList.toggle('active', !w); }
    warmBtn.addEventListener('click', () => setLightWarm(true));
    coolBtn.addEventListener('click', () => setLightWarm(false));
    // 环境光
    document.getElementById('ambientToggle').addEventListener('change', (e) => { state.light.ambient = e.target.checked; });
    // 材质
    const matBtns = document.querySelectorAll('.mat-btn');
    function highlightMat(mat) { matBtns.forEach(b => b.classList.toggle('active', b.dataset.mat === mat)); }
    matBtns.forEach(b => b.addEventListener('click', () => {
      const o = selectedObj();
      if (!o) { spawnFloater(CANVAS_W / 2, 200, '请先选择对象!', '#fde68a'); return; }
      if (o.kind === 'person' && b.dataset.mat !== 'skin') { spawnFloater(o.x, o.y - o.h / 2, '小人只能卡通皮肤', '#fca5a5'); return; }
      if (b.dataset.mat === 'skin' && o.kind !== 'person') { spawnFloater(o.x, o.y - o.h / 2, '皮肤仅限小人', '#fca5a5'); return; }
      o.mat = b.dataset.mat; o.hp = 100; highlightMat(o.mat);
    }));
    // 静音
    const muteBtn = document.getElementById('muteBtn');
    muteBtn.addEventListener('click', () => {
      state.muted = !state.muted; Sound.init(); Sound.setMuted(state.muted);
      muteBtn.textContent = state.muted ? '已静音' : '已开启'; muteBtn.classList.toggle('active', !state.muted);
    });
    // 摄像头开关
    const camBtn = document.getElementById('camBtn');
    camBtn.addEventListener('click', () => { state.camOn ? stopCamera() : startCamera(); });
    function updateCamBtn() { camBtn.textContent = state.camOn ? '关闭' : '开启'; camBtn.classList.toggle('active', state.camOn); }
    // 重置
    document.getElementById('resetBtn').addEventListener('click', () => {
      setScene(state.scene); state.breakCount = 0; updateBreakUI();
      spawnFloater(CANVAS_W / 2, 200, '✅ 场景已重置', '#86efac');
    });
    // 首次全局点击解锁音频
    window.addEventListener('pointerdown', () => { Sound.init(); Sound.resume(); }, { once: false });
    // 按 D 键切换调试面板
    window.addEventListener('keydown', (e) => { if (e.key === 'd' || e.key === 'D') dbgVisible = !dbgVisible; });

    // ============================================================
    // 【启动】
    // ============================================================
    setScene('office');
    document.querySelector('.scene-btn[data-scene="office"]').classList.add('active');
    setLightWarm(true);
    setCamTip('点击“开启”启用摄像头');
    camBox.classList.add('hidden-preview'); // 默认隐藏预览，开启后显示
    requestAnimationFrame(frame);
    // ===== 应用启动完成 =====
  </script>
</body>
</html>
